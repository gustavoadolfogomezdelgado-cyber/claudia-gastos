<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;min-height:100dvh;
    background:linear-gradient(165deg,#1e1b4b 0%,#312e81 40%,#4c1d95 100%);
    color:#fdf4ff;font-family:system-ui,-apple-system,sans-serif;
    padding-bottom:calc(72px + env(safe-area-inset-bottom));
  }
  .glass{
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(12px);
    border:1px solid rgba(249,168,212,.25);
    border-radius:18px;
  }
  .card-pink{
    background:linear-gradient(145deg,rgba(252,231,243,.15),rgba(167,139,250,.12));
    border:1px solid rgba(249,168,212,.35);
    border-radius:18px;
  }
  .btn-main{
    background:linear-gradient(135deg,#db2777,#a21caf);
    color:#fff;font-weight:700;border:none;border-radius:14px;
    padding:.85rem 1.2rem;width:100%;font-size:1rem;
    box-shadow:0 8px 24px rgba(219,39,119,.35);
  }
  .btn-main:active{transform:scale(.98);opacity:.9}
  .btn-ghost{
    background:rgba(255,255,255,.1);border:1px solid rgba(249,168,212,.3);
    color:#fce7f3;border-radius:12px;padding:.55rem 1rem;font-size:.85rem;font-weight:600;
  }
  .inp{
    width:100%;background:rgba(30,27,75,.6);border:1px solid rgba(249,168,212,.3);
    border-radius:12px;padding:.7rem .9rem;color:#fff;font-size:1rem;
  }
  .inp:focus{outline:none;border-color:#f9a8d4;box-shadow:0 0 0 3px rgba(249,168,212,.2)}
  .lab{display:block;font-size:.7rem;color:#f9a8d4;margin-bottom:.3rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
  .nav-bar{
    position:fixed;bottom:0;left:0;right:0;z-index:40;
    background:rgba(30,27,75,.95);backdrop-filter:blur(16px);
    border-top:1px solid rgba(249,168,212,.25);
    padding:8px 12px calc(8px + env(safe-area-inset-bottom));
    display:flex;justify-content:space-around;
  }
  .nav-item{flex:1;text-align:center;padding:6px 4px;color:#c4b5fd;font-size:.65rem;font-weight:600;cursor:pointer}
  .nav-item.on{color:#f9a8d4}
  .nav-item .ico{font-size:1.35rem;display:block;margin-bottom:2px}
  .screen{display:none;padding:1rem;max-width:480px;margin:0 auto}
  .screen.on{display:block}
  .logo{width:72px;height:72px;border-radius:50%;object-fit:cover;box-shadow:0 0 20px rgba(249,168,212,.4)}
  .amt{font-variant-numeric:tabular-nums;font-weight:700}
  .chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:.72rem;font-weight:600;background:rgba(249,168,212,.2);color:#fce7f3}
  .toast{
    position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
    background:#831843;color:#fce7f3;padding:.6rem 1.2rem;border-radius:999px;
    font-size:.85rem;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.3);
  }
  .modal-bg{position:fixed;inset:0;background:rgba(15,10,40,.75);z-index:60;display:flex;align-items:flex-end;justify-content:center}
  .modal{
    background:linear-gradient(180deg,#312e81,#1e1b4b);
    border-radius:24px 24px 0 0;width:100%;max-width:480px;
    padding:1.25rem 1.25rem calc(1.25rem + env(safe-area-inset-bottom));
    border-top:1px solid rgba(249,168,212,.3);
    max-height:90vh;overflow-y:auto;
  }
  .empty{text-align:center;padding:2.5rem 1rem;color:#c4b5fd}
  ::-webkit-scrollbar{width:0}
</style>

<script>
const DB='ClaudiaGastos', VER=1;
const STORES=['gastos','config'];
let db;

const DEF_CATS=['Comida 🍽️','Transporte 🚗','Hogar 🏠','Salud 💊','Belleza 💄','Ropa 👗','Ocio 🎬','Educación 📚','Servicios 📱','Otros ✨'];
const DEF={nombre:'Claudia', moneda:'BOB', simbolo:'Bs', categorias:DEF_CATS};

function openDB(){return new Promise((res,rej)=>{
  const r=indexedDB.open(DB,VER);
  r.onupgradeneeded=e=>{const d=e.target.result;STORES.forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id',autoIncrement:true})})};
  r.onsuccess=e=>{db=e.target.result;res(db)};r.onerror=()=>rej(r.error);
})}
function st(n,m='readonly'){return db.transaction(n,m).objectStore(n)}
function all(n){return new Promise((res,rej)=>{const r=st(n).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}
function one(n,id){return new Promise((res,rej)=>{const r=st(n).get(+id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function add(n,d){return new Promise((res,rej)=>{const r=st(n,'readwrite').add(d);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function put(n,d){return new Promise((res,rej)=>{const r=st(n,'readwrite').put(d);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function del(n,id){return new Promise((res,rej)=>{const r=st(n,'readwrite').delete(+id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}

async function cfg(){
  const rows=await all('config');
  if(!rows.length){const c={...DEF,id:1};await add('config',c);return c}
  return{...DEF,...rows[0]};
}
async function saveCfg(c){c.id=1;await put('config',c)}

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function toast(m){const t=$('#toast');t.textContent=m;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2200)}
function fmt(n,d=2){if(n==null||isNaN(n))return'0.00';return Number(n).toLocaleString('es-BO',{minimumFractionDigits:d,maximumFractionDigits:d})}
function localDateStr(d){
  const x=d instanceof Date?d:new Date(d);
  const y=x.getFullYear(), m=String(x.getMonth()+1).padStart(2,'0'), day=String(x.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+day;
}
function today(){return localDateStr(new Date())}
function startOfWeek(d=new Date()){
  const x=new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const day=(x.getDay()+6)%7; // Mon=0
  x.setDate(x.getDate()-day);
  return localDateStr(x);
}
function endOfWeek(d=new Date()){
  const x=new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const day=(x.getDay()+6)%7;
  x.setDate(x.getDate()-day+6);
  return localDateStr(x);
}
function startOfMonth(d=new Date()){return localDateStr(new Date(d.getFullYear(), d.getMonth(), 1))}
function endOfMonth(d=new Date()){return localDateStr(new Date(d.getFullYear(), d.getMonth()+1, 0))}

function go(name){
  $$('.screen').forEach(s=>s.classList.remove('on'));
  $$('.nav-item').forEach(n=>n.classList.toggle('on',n.dataset.s===name));
  const el=$('#s-'+name); if(el)el.classList.add('on');
  render(name);
}

async function render(name){
  const c=await cfg();
  const gastos=await all('gastos');
  const map={home:()=>R_home(gastos,c),list:()=>R_list(gastos,c),stats:()=>R_stats(gastos,c),cal:()=>R_cal(gastos,c),cats:()=>R_cats(c),cfg:()=>R_cfg(c)};
  if(map[name])await map[name]();
}

function sum(list){return list.reduce((s,g)=>s+(parseFloat(g.monto)||0),0)}
function byDay(gastos,fecha){return gastos.filter(g=>g.fecha===fecha)}
function byRange(gastos,from,to){return gastos.filter(g=>g.fecha>=from&&g.fecha<=to)}

async function R_home(gastos,c){
  const t=today();
  const weekFrom=startOfWeek();
  const weekTo=endOfWeek();
  const monFrom=startOfMonth();
  const monTo=endOfMonth();
  const hoy=sum(byDay(gastos,t));
  const sem=sum(byRange(gastos,weekFrom, weekTo < t ? weekTo : t)); // semana en curso hasta hoy
  const mes=sum(byRange(gastos,monFrom, monTo < t ? monTo : t)); // mes en curso hasta hoy
  const hoyList=byDay(gastos,t).sort((a,b)=>(b.id||0)-(a.id||0));
  const sym=c.simbolo||'Bs';

  $('#s-home').innerHTML=`
  <div class="card-pink p-4 mb-4 text-center">
    <p class="text-pink-200/80 text-xs mb-1">Hoy · ${t.split('-').reverse().join('/')}</p>
    <p class="text-3xl amt text-pink-100">${sym} ${fmt(hoy)}</p>
    <p class="text-xs text-violet-200 mt-1">${hoyList.length} gasto${hoyList.length!==1?'s':''} hoy</p>
  </div>
  <div class="grid grid-cols-2 gap-3 mb-4">
    <div class="glass p-3 text-center">
      <p class="text-[10px] text-pink-300 uppercase tracking-wide">Esta semana</p>
      <p class="text-lg amt text-white mt-1">${sym} ${fmt(sem)}</p>
    </div>
    <div class="glass p-3 text-center">
      <p class="text-[10px] text-pink-300 uppercase tracking-wide">Este mes</p>
      <p class="text-lg amt text-white mt-1">${sym} ${fmt(mes)}</p>
    </div>
  </div>
  <button class="btn-main mb-4" onclick="openGasto()">＋ Registrar gasto</button>
  <div class="flex items-center justify-between mb-2">
    <h2 class="text-sm font-semibold text-pink-200">Gastos de hoy</h2>
  </div>
  ${hoyList.length===0?`<div class="empty glass">Aún no registraste gastos hoy 💕<br><span class="text-xs">Toca el botón de arriba</span></div>`:
    hoyList.map(g=>itemHTML(g,c)).join('')}`;
}

function itemHTML(g,c){
  const sym=c.simbolo||'Bs';
  return`<div class="glass p-3 mb-2 flex items-center gap-3">
    <div class="flex-1 min-w-0">
      <div class="font-semibold text-sm truncate">${g.descripcion||g.categoria||'Gasto'}</div>
      <div class="text-xs text-pink-200/70 mt-0.5">${g.categoria||''} · ${g.fecha||''}${g.hora?' '+g.hora:''}</div>
    </div>
    <div class="text-right">
      <div class="amt text-pink-100">${sym} ${fmt(g.monto)}</div>
      <div class="flex gap-1 justify-end mt-1">
        <button class="btn-ghost" style="padding:2px 8px;font-size:11px" onclick="openGasto(${g.id})">✎</button>
        <button class="btn-ghost" style="padding:2px 8px;font-size:11px" onclick="delGasto(${g.id})">✕</button>
      </div>
    </div>
  </div>`;
}

async function R_list(gastos,c){
  const sorted=[...gastos].sort((a,b)=>(b.fecha+String(b.id)).localeCompare(a.fecha+String(a.id)));
  // group by date
  const by={};
  sorted.forEach(g=>{const k=g.fecha||'—';(by[k]=by[k]||[]).push(g)});
  const dates=Object.keys(by).sort((a,b)=>b.localeCompare(a));
  const sym=c.simbolo||'Bs';

  $('#s-list').innerHTML=`
  <div class="flex justify-between items-center mb-3">
    <h2 class="font-semibold text-pink-100">Todos los gastos</h2>
    <button class="btn-ghost" onclick="openGasto()">＋ Nuevo</button>
  </div>
  ${dates.length===0?`<div class="empty glass">Sin gastos registrados</div>`:
    dates.map(d=>{
      const list=by[d]; const tot=sum(list);
      return`<div class="mb-4">
        <div class="flex justify-between items-center mb-2 px-1">
          <span class="chip">${d.split('-').reverse().join('/')}</span>
          <span class="amt text-sm text-pink-200">${sym} ${fmt(tot)}</span>
        </div>
        ${list.map(g=>itemHTML(g,c)).join('')}
      </div>`;
    }).join('')}`;
}

async function R_stats(gastos,c){
  const t=today();
  // Rango editable "esta semana" (se guarda en memoria de sesión)
  if(!window._rangoSem){
    window._rangoSem={from:startOfWeek(), to: t};
  }
  // validar
  if(!window._rangoSem.from) window._rangoSem.from=startOfWeek();
  if(!window._rangoSem.to) window._rangoSem.to=t;

  const weekFrom=window._rangoSem.from;
  const weekTo=window._rangoSem.to;
  const monFrom=startOfMonth();
  const monTo=endOfMonth();
  const hoy=sum(byDay(gastos,t));
  const sem=sum(byRange(gastos,weekFrom, weekTo));
  const mes=sum(byRange(gastos,monFrom, t <= monTo ? t : monTo));
  const total=sum(gastos);
  const sym=c.simbolo||'Bs';

  // by category this month
  const mesList=byRange(gastos,monFrom, t <= monTo ? t : monTo);
  const catMap={};
  mesList.forEach(g=>{const k=g.categoria||'Otros ✨';catMap[k]=(catMap[k]||0)+(parseFloat(g.monto)||0)});
  const cats=Object.entries(catMap).sort((a,b)=>b[1]-a[1]);
  const maxCat=cats[0]?cats[0][1]:1;

  // last 7 days bars
  const days=[];
  for(let i=6;i>=0;i--){
    const d=new Date(); d.setDate(d.getDate()-i);
    const ds=localDateStr(d);
    days.push({d:ds, label:['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'][d.getDay()], tot:sum(byDay(gastos,ds))});
  }
  const maxDay=Math.max(...days.map(x=>x.tot),1);

  $('#s-stats').innerHTML=`
  <h2 class="font-semibold text-pink-100 mb-3">Resumen</h2>
  <div class="grid grid-cols-1 gap-3 mb-4">
    <div class="card-pink p-4 flex justify-between items-center">
      <div><p class="text-xs text-pink-200">Hoy (${t.split('-').reverse().join('/')})</p><p class="text-xl amt">${sym} ${fmt(hoy)}</p></div>
      <span class="text-2xl">📅</span>
    </div>

    <div class="glass p-4">
      <div class="flex justify-between items-start mb-2">
        <div>
          <p class="text-xs text-pink-300">Rango personalizado (semana / periodo)</p>
          <p class="text-xl amt mt-1">${sym} ${fmt(sem)}</p>
        </div>
        <span class="text-2xl">📆</span>
      </div>
      <div class="grid grid-cols-2 gap-2 mt-2">
        <div>
          <label class="lab">Desde</label>
          <input type="date" class="inp" id="rangoFrom" value="${weekFrom}" style="padding:.5rem;font-size:.85rem">
        </div>
        <div>
          <label class="lab">Hasta</label>
          <input type="date" class="inp" id="rangoTo" value="${weekTo}" style="padding:.5rem;font-size:.85rem">
        </div>
      </div>
      <div class="flex gap-2 mt-2">
        <button class="btn-main" style="padding:.55rem;font-size:.85rem" onclick="aplicarRangoSem()">Aplicar rango</button>
        <button class="btn-ghost" style="flex-shrink:0" onclick="resetRangoSem()">Esta semana</button>
      </div>
      <p class="text-[10px] text-violet-300 mt-2">Suma de todos los gastos entre esas fechas (inclusive)</p>
    </div>

    <div class="glass p-4 flex justify-between items-center">
      <div><p class="text-xs text-pink-300">Este mes (${monFrom.slice(5,7)}/${monFrom.slice(0,4)})</p><p class="text-xl amt">${sym} ${fmt(mes)}</p>
      <p class="text-[10px] text-violet-300 mt-0.5">Suma de todos los días del mes</p></div>
      <span class="text-2xl">🌸</span>
    </div>
    <div class="glass p-4 flex justify-between items-center">
      <div><p class="text-xs text-pink-300">Total histórico</p><p class="text-xl amt">${sym} ${fmt(total)}</p>
      <p class="text-[10px] text-violet-300 mt-0.5">Todos los gastos registrados</p></div>
      <span class="text-2xl">💜</span>
    </div>
  </div>

  <h3 class="text-sm font-semibold text-pink-200 mb-2">Últimos 7 días</h3>
  <div class="glass p-3 mb-4">
    <div class="flex items-end justify-between gap-1 h-28">
      ${days.map(x=>`
        <div class="flex-1 flex flex-col items-center gap-1 h-full justify-end">
          <span class="text-[9px] text-pink-200/80">${x.tot?fmt(x.tot,0):''}</span>
          <div style="height:${Math.max(4,(x.tot/maxDay)*100)}%;width:100%;max-width:28px;background:linear-gradient(180deg,#f9a8d4,#db2777);border-radius:6px 6px 2px 2px"></div>
          <span class="text-[10px] text-violet-200">${x.label}</span>
        </div>`).join('')}
    </div>
  </div>

  <h3 class="text-sm font-semibold text-pink-200 mb-2">Por categoría (mes)</h3>
  <div class="space-y-2">
    ${cats.length===0?`<div class="empty glass text-sm">Sin datos este mes</div>`:
      cats.map(([name,val])=>`
      <div class="glass p-3">
        <div class="flex justify-between text-sm mb-1"><span>${name}</span><span class="amt">${sym} ${fmt(val)}</span></div>
        <div class="h-2 rounded-full bg-violet-900/50 overflow-hidden">
          <div class="h-full rounded-full" style="width:${(val/maxCat)*100}%;background:linear-gradient(90deg,#f9a8d4,#db2777)"></div>
        </div>
      </div>`).join('')}
  </div>`;
}

async function R_cal(gastos,c){
  const sym=c.simbolo||'Bs';
  const now=new Date();
  if(window._calY==null) window._calY=now.getFullYear();
  if(window._calM==null) window._calM=now.getMonth();
  const y=window._calY, m=window._calM;
  const names=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

  const by={};
  gastos.forEach(g=>{
    if(!g.fecha)return;
    by[g.fecha]=(by[g.fecha]||0)+(parseFloat(g.monto)||0);
  });

  const first=new Date(y,m,1);
  const start=((first.getDay()+6)%7); // Mon=0
  const dim=new Date(y,m+1,0).getDate();
  const monFrom=localDateStr(new Date(y,m,1));
  const monTo=localDateStr(new Date(y,m+1,0));
  const mesTotal=sum(byRange(gastos,monFrom,monTo));

  let cells='';
  for(let i=0;i<start;i++) cells+=`<div style="min-height:64px"></div>`;
  for(let d=1;d<=dim;d++){
    const ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const amt=by[ds]||0;
    const isToday=ds===today();
    const has=amt>0;
    cells+=`<div class="glass" style="min-height:64px;padding:4px;border-radius:12px;${isToday?'border:1px solid #f9a8d4':''};${has?'background:rgba(219,39,119,.2)':''}"
      onclick="${has?`showDay('${ds}')`:''}">
      <div class="text-[11px] ${isToday?'text-pink-300 font-bold':'text-violet-200'}">${d}</div>
      ${has?`<div class="amt text-[10px] text-pink-100 mt-0.5 leading-tight">${sym} ${fmt(amt,0)}</div>`:''}
    </div>`;
  }

  $('#s-cal').innerHTML=`
  <div class="flex items-center justify-between mb-3">
    <button class="btn-ghost" onclick="window._calM--;if(window._calM<0){window._calM=11;window._calY--}go('cal')">←</button>
    <h2 class="font-semibold text-pink-100">${names[m]} ${y}</h2>
    <button class="btn-ghost" onclick="window._calM++;if(window._calM>11){window._calM=0;window._calY++}go('cal')">→</button>
  </div>
  <div class="card-pink p-3 text-center mb-3">
    <p class="text-xs text-pink-200">Total del mes</p>
    <p class="text-xl amt">${sym} ${fmt(mesTotal)}</p>
  </div>
  <div class="grid grid-cols-7 gap-1 text-center text-[10px] text-violet-300 mb-1">
    <div>L</div><div>M</div><div>X</div><div>J</div><div>V</div><div>S</div><div>D</div>
  </div>
  <div class="grid grid-cols-7 gap-1">${cells}</div>
  <p class="text-[10px] text-center text-violet-300 mt-3">Toca un día con gasto para ver el detalle</p>
  <div id="dayDetail" class="mt-3"></div>`;
}
function aplicarRangoSem(){
  const f=$('#rangoFrom')?.value;
  const t=$('#rangoTo')?.value;
  if(!f||!t){toast('Elige ambas fechas');return}
  if(f>t){toast('Desde no puede ser mayor que Hasta');return}
  window._rangoSem={from:f,to:t};
  toast('Rango aplicado ✨');
  go('stats');
}
function resetRangoSem(){
  window._rangoSem={from:startOfWeek(), to:today()};
  toast('Semana actual');
  go('stats');
}
function showDay(ds){
  all('gastos').then(async gastos=>{
    const c=await cfg();
    const sym=c.simbolo||'Bs';
    const list=byDay(gastos,ds).sort((a,b)=>(b.id||0)-(a.id||0));
    const tot=sum(list);
    const el=$('#dayDetail');
    if(!el)return;
    el.innerHTML=`
    <div class="glass p-3">
      <div class="flex justify-between mb-2">
        <span class="chip">${ds.split('-').reverse().join('/')}</span>
        <span class="amt text-pink-100">${sym} ${fmt(tot)}</span>
      </div>
      ${list.map(g=>itemHTML(g,c)).join('')||'<p class="text-sm text-violet-200">Sin gastos</p>'}
    </div>`;
  });
}

    <p class="font-semibold text-pink-200">📌 Poner en la pantalla de inicio (con tu logo)</p>
    <ol class="text-xs text-violet-200 list-decimal pl-4 space-y-1">
      <li>Abre esta página en <b>Chrome</b> (Android).</li>
      <li>Toca el menú <b>⋮</b> (arriba a la derecha).</li>
      <li>Elige <b>Añadir a la pantalla de inicio</b> o <b>Instalar aplicación</b>.</li>
      <li>Confirma: el icono será el logo de <b>Claudia</b>.</li>
    </ol>
    <p class="text-[10px] text-violet-300">Si el icono no se actualiza, desinstala el acceso anterior y vuelve a añadirlo.</p>
  </div>
  <p class="text-center text-[10px] text-violet-300 mt-4">Claudia · Control de gastos · Hecho con 💜</p>`;
}
async function saveC(){
  const c=await cfg();
  c.nombre=$('#c-nom').value||'Claudia';
  c.moneda=$('#c-mon').value||'BOB';
  c.simbolo=$('#c-sym').value||'Bs';
  await saveCfg(c); toast('Guardado ✨');
}
async function expJSON(){
  const data={gastos:await all('gastos'),config:await all('config'),exportedAt:new Date().toISOString()};
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
  a.download=`Claudia_gastos_${today()}.json`; a.click(); toast('Respaldo listo');
}
async function impJSON(e){
  const f=e.target.files[0]; if(!f)return;
  if(!confirm('¿Reemplazar todos los gastos por este respaldo?'))return;
  const data=JSON.parse(await f.text());
  for(const s of STORES){
    await new Promise((res,rej)=>{const r=st(s,'readwrite').clear();r.onsuccess=()=>res();r.onerror=()=>rej(r.error)});
    if(Array.isArray(data[s])) for(const rec of data[s]){const{id,...rest}=rec;await add(s,rest)}
  }
  toast('Importado 💕'); go('home'); e.target.value='';
}

async function openGasto(id=null){
  const c=await cfg();
  const g=id?await one('gastos',id):{};
  const cats=c.categorias||DEF_CATS;
  const now=new Date();
  const hora=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  $('#mod').innerHTML=`
  <div class="modal-bg" onclick="if(event.target===this)closeMod()">
    <div class="modal">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-bold text-pink-100">${id?'Editar gasto':'Nuevo gasto'}</h2>
        <button class="btn-ghost" onclick="closeMod()">✕</button>
      </div>
      <form onsubmit="saveGasto(event,${id||'null'})" class="space-y-3">
        <div><label class="lab">Monto *</label>
          <input class="inp" type="number" step="any" name="monto" required value="${g.monto??''}" placeholder="0.00" inputmode="decimal"></div>
        <div><label class="lab">Descripción</label>
          <input class="inp" name="descripcion" value="${g.descripcion||''}" placeholder="¿En qué gastaste?"></div>
        <div><label class="lab">Categoría</label>
          <select class="inp" name="categoria">
            ${cats.map(cat=>`<option ${g.categoria===cat?'selected':''}>${cat}</option>`).join('')}
          </select></div>
        <div class="grid grid-cols-2 gap-2">
          <div><label class="lab">Fecha</label>
            <input class="inp" type="date" name="fecha" required value="${g.fecha||today()}"></div>
          <div><label class="lab">Hora</label>
            <input class="inp" type="time" name="hora" value="${g.hora||hora}"></div>
        </div>
        <div><label class="lab">Nota</label>
          <input class="inp" name="nota" value="${g.nota||''}" placeholder="Opcional"></div>
        <button type="submit" class="btn-main">${id?'Guardar cambios':'Registrar gasto 💕'}</button>
      </form>
    </div>
  </div>`;
}
function closeMod(){$('#mod').innerHTML=''}

async function saveGasto(e,id){
  e.preventDefault();
  const f=e.target; const data={};
  [...f.elements].forEach(el=>{if(!el.name)return; let v=el.value; if(el.type==='number')v=v===''?null:parseFloat(v); data[el.name]=v});
  if(!data.monto||data.monto<=0){toast('Ingresa un monto válido');return}
  if(id){data.id=id; const old=await one('gastos',id)||{}; await put('gastos',{...old,...data,id}); toast('Actualizado ✨')}
  else{data.createdAt=new Date().toISOString(); await add('gastos',data); toast('Gasto registrado 💕')}
  closeMod();
  const active=$$('.nav-item.on')[0]?.dataset.s||'home';
  go(active);
}
async function delGasto(id){
  if(!confirm('¿Eliminar este gasto?'))return;
  await del('gastos',id); toast('Eliminado'); go($$('.nav-item.on')[0]?.dataset.s||'home');
}

(async()=>{await openDB(); await cfg(); go('home')})();
</script>
</body>
</html>
